    - heading "Does cheaper housing make life more expensive?" [level=1] [ref=f4e7]
    - heading "Yerevan · 5 November 2026" [level=4] [ref=f4e8]
  - paragraph [ref=f4e9]:
    - strong [ref=f4e10]: Lower rent survives the baseline comparison.
    - text: Six charts compare real asking rents with modeled travel and winter bills.
  - paragraph [ref=f4e11]: Select a chart to open its full-size image.
  - generic [ref=f4e12]:
    - heading "Where is rent cheaper?" [level=2] [ref=f4e13]
    - button "Show" [ref=f4e16] [cursor=pointer]
    - paragraph [ref=f4e17]:
      - link [ref=f4e18] [cursor=pointer]:
        - /url: ../figures/01-rent.png
        - img "Open full-size boxplots of observed asking rent distributions by district" [ref=f4e19]
    - paragraph [ref=f4e21]:
      - strong [ref=f4e22]: Kentron has the highest median asking rent.
      - text: Its median is 500,000 AMD, compared with 350,000–400,000 AMD elsewhere in this sample. The boxes show overlapping distributions, so district alone does not determine a listing’s price.
  - generic [ref=f4e23]:
    - heading "How much longer is the commute?" [level=2] [ref=f4e24]
    - button "Show" [ref=f4e27] [cursor=pointer]
    - paragraph [ref=f4e28]:
      - link [ref=f4e29] [cursor=pointer]:
        - /url: ../figures/02-commute.png
        - img "Open full-size chart of modeled one-way commute minutes by district and mode" [ref=f4e30]
    - paragraph [ref=f4e32]:
      - strong [ref=f4e33]: Public transport takes longer in these modeled comparisons.
      - text: Longer connecting lines show a larger gap between the two modes. Kentron is closer to the shared destination. These are road-based scenarios—not timed journeys, live traffic, or actual bus routes.
  - generic [ref=f4e34]:
    - heading "What does the monthly budget include?" [level=2] [ref=f4e35]
    - button "Show" [ref=f4e38] [cursor=pointer]
    - paragraph [ref=f4e39]:
      - link [ref=f4e40] [cursor=pointer]:
        - /url: ../figures/03-budget.png
        - img "Open full-size chart of modeled rent, utility and transport components" [ref=f4e41]
    - paragraph [ref=f4e43]:
      - strong [ref=f4e44]: Rent is the largest part of the selected budget.
      - text: Modeled winter utilities add 24,769 AMD everywhere. Public fares can be the same despite a longer journey; driving adds distance-dependent costs. Time is not a cash cost and is added in the next chart.
  - generic [ref=f4e45]:
    - heading "How much saving remains after valuing time?" [level=2] [ref=f4e46]
    - button "Show" [ref=f4e49] [cursor=pointer]
    - paragraph [ref=f4e50]:
      - link [ref=f4e51] [cursor=pointer]:
        - /url: ../figures/04-saving.png
        - img "Open full-size waterfall showing how rent savings are reduced by added transport and valued time" [ref=f4e52]
    - paragraph [ref=f4e54]:
      - strong [ref=f4e55]: Even the most exposed baseline example retains a saving.
      - text: The waterfall follows Davtashen, selected because it contains the smallest remaining saving. All 20 district–mode examples remain cheaper than Kentron at about 861 AMD/hour for time. These results apply to the stated sample and assumptions.
  - generic [ref=f4e56]:
    - heading "When can the answer change?" [level=2] [ref=f4e57]
    - button "Show" [ref=f4e60] [cursor=pointer]
    - paragraph [ref=f4e61]:
      - link [ref=f4e62] [cursor=pointer]:
        - /url: ../figures/05-sensitivity.png
        - img "Open full-size heatmap of savings under heavier winter and commuting assumptions" [ref=f4e63]
    - paragraph [ref=f4e65]:
      - strong [ref=f4e66]: More commuting and heating can erase the saving in some cases.
      - text: The chosen grid contains 2 more-expensive cases. The chart shows one heavy-commuting winter example; it does not estimate how often households face those conditions. Two-car cases assume separate journeys and vehicles.
  - generic [ref=f4e67]:
    - heading "When would the saving disappear?" [level=2] [ref=f4e68]
    - button "Show" [ref=f4e71] [cursor=pointer]
    - paragraph [ref=f4e72]:
      - link [ref=f4e73] [cursor=pointer]:
        - /url: ../figures/06-break-even.png
        - img "Open full-size dotplot of twenty break-even time values and the gross wage benchmark" [ref=f4e74]
    - paragraph [ref=f4e76]:
      - strong [ref=f4e77]: The answer depends on how you value extra time.
      - text: The lowest positive threshold is about 4,555 AMD/hour, above the 1,722 AMD/hour gross benchmark used here. This is a conditional calculation, and some district samples are small.
  - generic [ref=f4e78]:
    - heading "What should a renter take from this?" [level=2] [ref=f4e79]
    - paragraph [ref=f4e80]: In the baseline model, the rent saving is large enough to cover the selected extra costs. A renter should still compare a real quote with their own commute, heating needs and value of time. The stress chart shows why the conclusion should remain conditional.
    - paragraph [ref=f4e81]:
      - text: The evidence does
      - strong [ref=f4e82]: not
      - text: support a blanket claim that cheaper noncentral housing always becomes more expensive. It also does not prove that every noncentral apartment is cheaper overall.
