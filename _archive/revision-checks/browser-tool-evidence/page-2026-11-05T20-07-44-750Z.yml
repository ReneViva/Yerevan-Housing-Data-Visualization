  - generic [ref=f4e89]:
    - heading "Data and limitations" [level=3] [ref=f4e90]
    - paragraph [ref=f4e91]:
      - text: The four CSVs in
      - code [ref=f4e92]: data/
      - text: are the complete inputs.
      - code [ref=f4e93]: rentals.csv
      - text: "is already cleaned: 276 native-AMD, two-room, 45–75 m² advertisements with furniture advertised and usable route inputs. The original 949-record extraction, exclusion evidence and route replies are preserved in"
      - code [ref=f4e94]: _archive/previous-version/
      - text: .
    - paragraph [ref=f4e95]: This is one agency’s catalogue, retrieved on 5 November 2026—not random sampling or completed leases. Availability and last price-update dates are unverified. Condition and building information are incomplete, and district labels/coordinates may be approximate. These comparisons are not quality-adjusted or causal. Outside Kentron is not outside the Yerevan municipality; Abovyan and Masis are not compared.
    - paragraph [ref=f4e96]: Boxes show listing quartiles, and whiskers extend to values within 1.5 box lengths; dots show values beyond them. These are not confidence intervals. We do not manufacture population p-values from convenience advertisements or scenario rows. The graphs communicate descriptive statistics and sensitivity to assumptions.
    - paragraph [ref=f4e97]: The original broader checks included faster/slower travel, transfers, a narrower size band and alternative aggregation. Their evidence remains archived; the simplified report retains the same primary sample, baseline calculations and full household/heating/time grid.
  - generic [ref=f4e98]:
    - heading "Reproduce the report" [level=3] [ref=f4e99]
    - paragraph [ref=f4e100]:
      - text: Open
      - code [ref=f4e101]: YerevanHousing.Rproj
      - text: ", open this Rmd, then click"
      - strong [ref=f4e102]: Knit
      - text: . Both HTML and Unicode-capable PDF go into
      - code [ref=f4e103]: outputs/
      - text: ; the six chart images go into
      - code [ref=f4e104]: figures/
      - text: . All calculations run here using local CSVs. No development scripts, downloads or new package installations are required during knitting. HTML code is folded; use its Code buttons to reveal the chart code. The matching Word file explains every chunk.
    - paragraph [ref=f4e105]: AI assistance was used for research, coding, writing and verification. The student should understand the work and confirm the instructor’s submission and AI policies. Existing package-build warnings from newer R patch versions are a known environment limitation; the report is checked by actual execution.
