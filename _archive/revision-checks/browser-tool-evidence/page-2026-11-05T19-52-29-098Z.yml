    - heading "Does cheaper housing make life more expensive?" [level=1] [ref=f3e7]
    - heading "Yerevan · 5 November 2026" [level=4] [ref=f3e8]
  - paragraph [ref=f3e9]:
    - strong [ref=f3e10]: Lower rent survives the baseline comparison.
    - text: Six charts compare real asking rents with modeled travel and winter bills.
  - paragraph [ref=f3e11]: Select a chart to open its full-size image.
  - generic [ref=f3e12]:
    - heading "Where is rent cheaper?" [level=2] [ref=f3e13]
    - button "Show" [ref=f3e16] [cursor=pointer]
    - paragraph [ref=f3e17]:
      - link [ref=f3e18] [cursor=pointer]:
        - /url: ../figures/01-rent.png
        - img "Open full-size chart of median asking rents and listing quartiles by district" [ref=f3e19]
    - paragraph [ref=f3e21]:
      - strong [ref=f3e22]: Kentron has the highest median asking rent.
      - text: Its median is 500,000 AMD, compared with 350,000–400,000 AMD elsewhere in this sample. The whiskers show that prices still vary within each district.
  - generic [ref=f3e23]:
    - heading "How much longer is the commute?" [level=2] [ref=f3e24]
    - button "Show" [ref=f3e27] [cursor=pointer]
    - paragraph [ref=f3e28]:
      - link [ref=f3e29] [cursor=pointer]:
        - /url: ../figures/02-commute.png
        - img "Open full-size chart of modeled one-way commute minutes by district and mode" [ref=f3e30]
    - paragraph [ref=f3e32]:
      - strong [ref=f3e33]: The rent saving comes with more modeled travel time.
      - text: Kentron is closer to the shared destination in these district examples. These are road-based scenarios—not timed journeys, live traffic, or actual bus routes.
  - generic [ref=f3e34]:
    - heading "What does the monthly budget include?" [level=2] [ref=f3e35]
    - button "Show" [ref=f3e38] [cursor=pointer]
    - paragraph [ref=f3e39]:
      - link [ref=f3e40] [cursor=pointer]:
        - /url: ../figures/03-budget.png
        - img "Open full-size chart of modeled rent, utility and transport components" [ref=f3e41]
    - paragraph [ref=f3e43]:
      - strong [ref=f3e44]: Rent is the largest part of the selected budget.
      - text: Modeled winter utilities add 24,769 AMD everywhere. Public fares can be the same despite a longer journey; driving adds distance-dependent costs. Time is not a cash cost and is added in the next chart.
  - generic [ref=f3e45]:
    - heading "How much saving remains after valuing time?" [level=2] [ref=f3e46]
    - button "Show" [ref=f3e49] [cursor=pointer]
    - paragraph [ref=f3e50]:
      - link [ref=f3e51] [cursor=pointer]:
        - /url: ../figures/04-saving.png
        - img "Open full-size chart of monthly saving relative to Kentron after valuing time" [ref=f3e52]
    - paragraph [ref=f3e54]:
      - strong [ref=f3e55]: The baseline rent savings survive the extra costs.
      - text: All 20 district–mode examples remain cheaper than Kentron when time is valued at about 861 AMD/hour. That finding applies to this sample and these assumptions, not every apartment or household.
  - generic [ref=f3e56]:
    - heading "When can the answer change?" [level=2] [ref=f3e57]
    - button "Show" [ref=f3e60] [cursor=pointer]
    - paragraph [ref=f3e61]:
      - link [ref=f3e62] [cursor=pointer]:
        - /url: ../figures/05-sensitivity.png
        - img "Open full-size heatmap of savings under heavier winter and commuting assumptions" [ref=f3e63]
    - paragraph [ref=f3e65]:
      - strong [ref=f3e66]: More commuting and heating can erase the saving in some cases.
      - text: The chosen grid contains 2 more-expensive cases. The chart shows one heavy-commuting winter example; it does not estimate how often households face those conditions. Two-car cases assume separate journeys and vehicles.
  - generic [ref=f3e67]:
    - heading "When would the saving disappear?" [level=2] [ref=f3e68]
    - button "Show" [ref=f3e71] [cursor=pointer]
    - paragraph [ref=f3e72]:
      - link [ref=f3e73] [cursor=pointer]:
        - /url: ../figures/06-break-even.png
        - img "Open full-size chart of break-even time values and the gross wage benchmark" [ref=f3e74]
    - paragraph [ref=f3e76]:
      - strong [ref=f3e77]: The answer depends on how you value extra time.
      - text: The lowest positive threshold is about 4,555 AMD/hour, above the 1,722 AMD/hour gross benchmark used here. This is a conditional calculation, and some district samples are small.
  - generic [ref=f3e78]:
    - heading "What should a renter take from this?" [level=2] [ref=f3e79]
    - paragraph [ref=f3e80]: In the baseline model, the rent saving is large enough to cover the selected extra costs. A renter should still compare a real quote with their own commute, heating needs and value of time. The stress chart shows why the conclusion should remain conditional.
    - paragraph [ref=f3e81]:
      - text: The evidence does
      - strong [ref=f3e82]: not
      - text: support a blanket claim that cheaper noncentral housing always becomes more expensive. It also does not prove that every noncentral apartment is cheaper overall.
